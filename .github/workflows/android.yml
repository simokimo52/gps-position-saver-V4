name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew is committed with the executable bit, but some checkouts drop it.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Ensure Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            echo "::error::sdkmanager not found at ${SDKMANAGER}"
            exit 1
          fi

          # Runner images already ship these; this is a safety net. `yes` receives
          # SIGPIPE as soon as sdkmanager stops reading stdin, so the pipelines are
          # tolerated here (GitHub's default shell runs with `pipefail`).
          yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true
          yes | "${SDKMANAGER}" "platforms;android-35" "build-tools;35.0.0" || true

          # Fail loudly if what the build actually needs is still missing.
          test -d "${ANDROID_HOME}/platforms/android-35"
          test -n "$(ls -d "${ANDROID_HOME}"/build-tools/*/ 2>/dev/null)"

      # The app signs with a keystore that is git-ignored. Prefer a repository
      # secret so the signature stays stable across runs; otherwise fall back to
      # a throwaway key (installable, but its identity changes every run).
      - name: Provide signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "Using keystore from the ANDROID_KEYSTORE_BASE64 secret."
            printf '%s' "$KEYSTORE_B64" | base64 -d > debug.keystore
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — generating a throwaway keystore."
            echo "::warning::The APK installs fine, but its signature will differ on the next run."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APKs
        id: collect
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SHORT_SHA=$(git rev-parse --short HEAD)
          OUT="artifacts"
          mkdir -p "$OUT"

          cp app/build/outputs/apk/debug/app-debug.apk \
             "$OUT/gps-position-saver-${VERSION}-${SHORT_SHA}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk \
             "$OUT/gps-position-saver-${VERSION}-${SHORT_SHA}-release.apk"

          # Fail loudly if anything came out unsigned. Walk build-tools newest-first
          # and take the first that actually ships apksigner, so a partial install
          # cannot trip `set -e` before the real checks run.
          APKSIGNER=""
          for dir in $(ls -d "${ANDROID_HOME}"/build-tools/*/ 2>/dev/null | sort -Vr); do
            if [ -x "${dir}apksigner" ]; then
              APKSIGNER="${dir}apksigner"
              break
            fi
          done
          if [ -z "${APKSIGNER}" ]; then
            echo "::error::Could not find an executable apksigner under ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          echo "using ${APKSIGNER}"

          for apk in "$OUT"/*.apk; do
            "${APKSIGNER}" verify --verbose "$apk" > /dev/null
            echo "verified signature: $apk"
          done

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gps-position-saver-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" artifacts/*.apk \
            --title "GPS Position Saver ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag || \
          gh release upload "${GITHUB_REF_NAME}" artifacts/*.apk --clobber
